<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nome do Projeto | Acesso</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="pagina-login">
    <section class="login-card" aria-labelledby="titulo-login">
      <div class="marca" aria-hidden="true">APP</div>

      <!-- TODO 1: substituir pelo nome e descrição do projeto do grupo. -->
      <h1 id="titulo-login">Acessar o sistema</h1>
      <p class="subtitulo">Use seus dados para continuar.</p>

      <form id="form-login" novalidate>
        <div class="campo">
          <label for="email">E-mail</label>
          <input id="email" name="email" type="email" placeholder="nome@exemplo.com" autocomplete="email">
          <small id="erro-email" class="erro" aria-live="polite"></small>
        </div>

        <div class="campo">
          <label for="senha">Senha</label>
          <input id="senha" name="senha" type="password" placeholder="Mínimo de 6 caracteres" autocomplete="current-password">
          <small id="erro-senha" class="erro" aria-live="polite"></small>
        </div>

        <button type="submit">Entrar</button>
        <p id="mensagem" class="mensagem" aria-live="polite"></p>
      </form>

      <!-- TODO 2: criar links para as demais telas essenciais do projeto. -->
      <nav class="links" aria-label="Ações auxiliares">
        <a href="#">Esqueci minha senha</a>
        <a href="#">Criar cadastro</a>
      </nav>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
